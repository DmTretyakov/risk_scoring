# Scrapes the online services and the batch monitor. Alerts are evaluated here and
# visible at :9090/alerts and in Grafana; production would route them via Alertmanager.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: decision-api
    static_configs: [{targets: ["decision-api:8000"]}]
  - job_name: scorers
    static_configs: [{targets: ["scorer-v1:8000", "scorer-v2:8000"]}]
  - job_name: monitor
    static_configs: [{targets: ["monitor:9100"]}]

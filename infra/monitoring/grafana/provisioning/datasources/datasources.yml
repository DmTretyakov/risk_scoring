apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Postgres
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_reader          # read-only role from infra/db/002_monitoring.sql
    secureJsonData:
      password: grafana-dev-only
    jsonData:
      database: decisions
      sslmode: disable
      postgresVersion: 1600

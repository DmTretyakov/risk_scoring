# Local stack. Credentials below are for local development only. See README.md.
name: novicap

x-db-env: &db-env
  POSTGRES_USER: novicap
  POSTGRES_PASSWORD: novicap-dev-only

x-healthcheck-http: &http-health
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
  interval: 5s
  retries: 10

x-scorer: &scorer
  build:
    context: .
    dockerfile: services/scorer/Dockerfile
    target: runtime
  healthcheck: *http-health

x-api-build: &api-build
  context: .
  dockerfile: services/decision_api/Dockerfile
  target: runtime

x-api-env: &api-env
  SCORER_URLS: v1=http://scorer-v1:8000,v2=http://scorer-v2:8000
  # Rollout (services/decision_api/app/router.py): CANARY_PERCENT=0 shadow, 1-99 canary, 100 full.
  PRIMARY_MODEL: ${PRIMARY_MODEL:-v1}
  CANDIDATE_MODEL: ${CANDIDATE_MODEL:-v2}
  CANARY_PERCENT: ${CANARY_PERCENT:-0}

services:
  # ---- storage ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *db-env
      POSTGRES_DB: decisions
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db:/docker-entrypoint-initdb.d:ro   # runs *.sql once, on an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novicap -d decisions"]
      interval: 3s
      retries: 20

  redis:
    # Rate-limit counters and retry cache: disposable, so no persistence on purpose.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb",
              "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # ---- decision path -----------------------------------------------------------
  # Same image, one pinned model version each. Not reachable from the host.
  scorer-v1:
    <<: *scorer
    environment: {MODEL_VERSION: v1}
  scorer-v2:
    <<: *scorer
    environment: {MODEL_VERSION: v2}

  decision-api:
    build: *api-build
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://novicap:novicap-dev-only@postgres:5432/decisions
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8010:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      scorer-v1: {condition: service_healthy}
      scorer-v2: {condition: service_healthy}
    healthcheck: *http-health

  # ---- monitoring ----------------------------------------------------------------
  monitor:
    # Batch drift job: same image as the API, different command.
    build: *api-build
    command: ["python", "-m", "app.monitoring", "run", "--every", "30"]
    environment:
      DATABASE_URL: postgresql://novicap:novicap-dev-only@postgres:5432/decisions
      WINDOW_MINUTES: "60"
      MIN_COMPANIES: "100"
    depends_on:
      postgres: {condition: service_healthy}

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [decision-api, monitor]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # local demo: open read-only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin-dev-only
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/decision-service.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3010:3000"]
    depends_on: [prometheus, postgres]

  # ---- tests (docker compose --profile test run --rm <name>) ----------------------
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/decision_api/Dockerfile
      target: test
    environment:
      <<: *api-env
      PRIMARY_MODEL: v1
      CANDIDATE_MODEL: v2
      CANARY_PERCENT: "0"
      DATABASE_URL: postgresql://novicap:novicap-dev-only@postgres:5432/decisions_test
      ADMIN_DATABASE_URL: postgresql://novicap:novicap-dev-only@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/1
      RATE_LIMIT_CAPACITY: "100000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      scorer-v1: {condition: service_healthy}
      scorer-v2: {condition: service_healthy}

  scorer-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: services/scorer/Dockerfile
      target: test

volumes:
  pgdata:

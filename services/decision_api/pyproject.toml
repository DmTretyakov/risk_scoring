[project]
name = "decision-api"
version = "0.3.0"
description = "Credit decision API: data gate, duplicate check, model routing, persistence, drift monitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "pydantic==2.11.4",
    "psycopg[binary]==3.2.9",
    "psycopg-pool==3.2.6",
    "httpx==0.28.1",
    "redis==5.2.1",
    "prometheus-client==0.21.1",
]

[dependency-groups]
dev = ["pytest==8.3.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning"]
